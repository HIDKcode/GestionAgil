<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Automatización-Alertas </title>

   <link rel="stylesheet" href="\static\css\styles.css">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>

<body class="divprincipal">

  <section id="navbar"></section>

  <section id="sidebar"></section>

  <main id="main">

    <div class="center">
      <h2>Contenido de AUTOMATIZACIÓN Y ALERTAS</h2>
    </div>
    

  </main>

  


<script>
  // Función para cargar HTML externo
  function includeHTML(id, url) {
    fetch(url)
      .then(response => response.text())
      .then(data => document.getElementById(id).innerHTML = data);
  }

  includeHTML("navbar", "extends/navbar.html");
  includeHTML("sidebar", "extends/sidebar.html");
</script>

<script src="/static/scripts/credentials.js" defer></script>
</body>
</html>
